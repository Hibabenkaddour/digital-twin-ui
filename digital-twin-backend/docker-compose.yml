services:
  # PostgreSQL Database — Métadonnées (twins, config)
  postgres:
    image: postgres:15
    container_name: digital_twin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: digital_twin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d digital_twin" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # PostgreSQL Database — Télémétrie live
  postgres_telemetry:
    image: postgres:15
    container_name: digital_twin_telemetry_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: telemetry_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata_telemetry:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d telemetry_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Keycloak IAM — Auth server for multi-tenant login
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: digital_twin_keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: digital_twin
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgrespassword
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pgdata_telemetry:
